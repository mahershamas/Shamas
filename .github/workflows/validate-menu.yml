name: Validate menu data

on:
  push:
    paths: ["data/**", "scripts/**", ".github/workflows/validate-menu.yml"]
  pull_request:
    paths: ["data/**", "scripts/**", ".github/workflows/validate-menu.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-menu.mjs
